name: Digest animazione

*07:00 UTC = 09:00 in Italia d'estate, 08:00 d'inverno*
on:
  schedule:
    - cron: "13 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cerca il programma e invia il digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          FILE=$(find . -name bot.py -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            FILE=$(find . -name '*.py' -not -path './.git/*' | head -n 1)
          fi
          if [ -z "$FILE" ]; then
            echo "nessun file .py trovato nel repository"
            exit 1
          fi
          echo "Uso $FILE"
          python "$FILE" --once

      - name: Salva lo stato
        run: |
          if [ -n "$(git status --porcelain stato.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add stato.json
            git commit -m "stato aggiornato"
            git push
          fi
