name: Controlla film animazione

on:
  schedule:
    # Orari in UTC: 08, 14, 20 = 9, 15, 21 in Italia con l'ora solare
    # (10, 16, 22 con l'ora legale)
    - cron: "0 8,14,20 * * *"
  workflow_dispatch:   # permette di lanciarlo a mano dal sito

permissions:
  contents: write      # serve per salvare stato.json nel repository

concurrency:
  group: controlla
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python controlla.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Salva lo stato
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add stato.json
          git diff --staged --quiet || (git commit -m "Aggiorna stato" && git push)
          
